plugins {
    id 'com.android.application'
}

android {
    namespace 'com.koolkatze.fm1offline'
    compileSdk 35

    defaultConfig {
        applicationId 'com.koolkatze.fm1offline'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
