# Experimental physical FM-1 controller firmware. This is NOT the Android APK.
# Never flashes hardware. APK updates cannot install a physical FM-1 firmware.
name: Build Blackhole Remote MIDI controller for physical FM-1 (experimental)

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/patch_ctl1_workbench.py"
      - "tools/blackhole_remote_display.inc"
      - "tools/generate_blackhole_bitmap.py"
      - ".github/workflows/ctl1-workbench-remote.yml"

permissions:
  contents: read

concurrency:
  group: physical-remote-fm1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  experimental-physical-firmware:
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      sdk: true
      tests-block: true
      build: |
        set -euo pipefail
        # Do not mix the phone emulator APK with a physical-device binary.
        mkdir -p build/physical-fm1-remote
        git clone --recursive https://github.com/charlesvestal/fm1-ctl.git build/ctl1-upstream
        git -C build/ctl1-upstream checkout --detach 772b90f8e7d84fb8f87d51857f2289cc6aac8e32
        git -C build/ctl1-upstream submodule update --init --recursive
        sudo apt-get update -qq
        sudo apt-get install -y -qq libfribidi0
        python3 -c 'from PIL import features; assert features.check("raqm"), "Pillow without raqm"'
        python3 tools/patch_ctl1_workbench.py build/ctl1-upstream --dry-run
        python3 tools/patch_ctl1_workbench.py build/ctl1-upstream
        python3 tools/generate_blackhole_bitmap.py build/ctl1-upstream/app/blackhole_bitmap.h
        (
          cd build/ctl1-upstream
          ./build.sh --no-ble
        )
        cp build/ctl1-upstream/app/build/blackhole-usb.fwsc build/physical-fm1-remote/Blackhole-Remote-USB-EXPERIMENTAL.fwsc
        (
          cd build/ctl1-upstream
          ./build.sh
        )
        cp build/ctl1-upstream/app/build/blackhole.fwsc build/physical-fm1-remote/Blackhole-Remote-BLE-EXPERIMENTAL.fwsc
      test: |
        set -euo pipefail
        python3 -m py_compile tools/patch_ctl1_workbench.py
        test -s build/physical-fm1-remote/Blackhole-Remote-USB-EXPERIMENTAL.fwsc
        test -s build/physical-fm1-remote/Blackhole-Remote-BLE-EXPERIMENTAL.fwsc
        grep -q 'wb_remote_input();' build/ctl1-upstream/app/ui.c
        grep -q '#define WB_REMOTE_ONLY 1' build/ctl1-upstream/app/ui.c
        grep -q '102u, 42u' build/ctl1-upstream/app/ui.c
        grep -q 'bh_remote_keyboard' build/ctl1-upstream/app/blackhole_remote_display.inc
        grep -Fq 'bh_art_splash[34560]' build/ctl1-upstream/app/blackhole_bitmap.h
        grep -Fq 'bh_art_widget[2816]' build/ctl1-upstream/app/blackhole_bitmap.h
        grep -Fq 'bh_intro_step()' build/ctl1-upstream/app/ui.c
        grep -Fq 'bh_intro_start();' build/ctl1-upstream/app/ui.c
        grep -Fq 'bh_glitch_image(0u, 0)' build/ctl1-upstream/app/app.c
        grep -Fq 'cv_px[i] = swap16(bh_art_palette[bh_art_splash[i]])' build/ctl1-upstream/app/blackhole_remote_display.inc
        grep -Fq 'BH_WAIT_KEY' build/ctl1-upstream/app/blackhole_remote_display.inc
        grep -Fq 'bh_intro_pending' build/ctl1-upstream/app/blackhole_remote_display.inc
        grep -Fq 'bh_glass_rect(5, 83, 71, 53)' build/ctl1-upstream/app/blackhole_remote_display.inc
        grep -Fq 'bh_mix565' build/ctl1-upstream/app/blackhole_remote_display.inc
        ! grep -Fq 'bh_boot_splash_until' build/ctl1-upstream/app/ui.c
        grep -q 'bh_remote_leds' build/ctl1-upstream/app/blackhole_remote_display.inc
        grep -q 'int plat_battery_percent(void)' build/ctl1-upstream/base/device/plat_fm1.c
        # Regression: Blackhole must NOT restore saved CTL-1 analogue Touch
        # mode (it monopolises the only ADC and can leave BATT at --%).
        grep -Fq '#if !WB_REMOTE_ONLY' build/ctl1-upstream/app/ui.c
        grep -Fq '#endif /* The remote does not use CTL-1' build/ctl1-upstream/app/ui.c
        grep -Fq 'sample = fm1_adc_read(FM1_ADC_BATT);' build/ctl1-upstream/base/device/plat_fm1.c
        grep -Fq 'retry_ms = now + 350u;' build/ctl1-upstream/base/device/plat_fm1.c
        grep -Fq '"NO ADC"' build/ctl1-upstream/app/blackhole_remote_display.inc
        grep -Fq '(pct < 0 && plat_ms() >= 1500u)' build/ctl1-upstream/app/blackhole_remote_display.inc
        grep -q 'int plat_usb_midi_connected(void)' build/ctl1-upstream/base/device/plat_fm1.c
        grep -q 'BLACKHOLE REMOTE' build/ctl1-upstream/app/app.h
      packages: build/physical-fm1-remote/*.fwsc

  release-battery-beta:
    name: Release Blackhole Remote battery fix (experimental beta 3)
    needs: experimental-physical-firmware
    if: ${{ success() && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download exactly the firmware binaries that passed CI
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: downloaded
      - name: Publish versioned experimental FM-1 firmware (never overwrite a release)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=blackhole-remote-v0.1.0-beta.3
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Beta 3 release already exists; refusing to overwrite a previously published binary."
            exit 0
          fi
          source=downloaded/build/physical-fm1-remote
          test -s "$source/Blackhole-Remote-BLE-EXPERIMENTAL.fwsc"
          test -s "$source/Blackhole-Remote-USB-EXPERIMENTAL.fwsc"
          mkdir -p dist
          cp "$source/Blackhole-Remote-BLE-EXPERIMENTAL.fwsc" \
             dist/Blackhole-Remote-HD-v0.1.0-beta.3-Bluetooth-USB.fwsc
          cp "$source/Blackhole-Remote-USB-EXPERIMENTAL.fwsc" \
             dist/Blackhole-Remote-HD-v0.1.0-beta.3-USB-Only.fwsc
          ( cd dist && sha256sum ./*.fwsc > SHA256SUMS.txt )
          cat > dist/RELEASE_NOTES.md <<'NOTES'
          ## Blackhole Remote HD v0.1.0 beta 3 — battery ADC fix

          This FM-1 hardware firmware corrects the stuck `--%` battery
          readout. Blackhole is a MIDI controller, so it disables the
          upstream CTL-1 analog key-pressure scan during initialization;
          the device's shared ADC can then sample the PB1 battery divider.
          If the normal platform 100-ms sampling does not initialize
          the reading, the remote retries an ADC conversion only when
          the converter is free, no more than once every 350 ms.
          The HUD shows an approximate numeric battery level when the
          ADC reports data, and displays `NO ADC` if the sensor remains
          unavailable (never fabricates a percentage).

          All 27 MIDI keys, USB/Bluetooth MIDI controls, splash, LEDs,
          LCD artwork and protocol with FM-1 Workbench remain unchanged.
          **Only the physical Blackhole firmware was modified.**

          Both packages were compiled with the JieLi toolchain and passed
          host and build regressions. The fix has not yet been verified on
          a physical FM-1; this is an experimental prerelease. Keep your
          working firmware and recovery procedure.
          NOTES
          gh release create "$tag" dist/*.fwsc dist/SHA256SUMS.txt \
            --repo "$GH_REPO" --target "$GITHUB_SHA" \
            --title "Blackhole Remote HD v0.1.0 beta 3 — battery readout fix" \
            --notes-file dist/RELEASE_NOTES.md --prerelease
          gh release view "$tag" --repo "$GH_REPO" --json assets,url \
            --jq '.url, (.assets[] | .name + " " + .url)'
