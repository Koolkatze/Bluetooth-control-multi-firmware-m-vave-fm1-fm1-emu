name: Publish M-VAVE FM1 firmware bundle

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/publish-fm1-release.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish APK to GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release automation
        uses: actions/checkout@v4

      - name: Fetch previously built and validated FM-1 Android APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh run download 41220501678 --repo "$GITHUB_REPOSITORY" \
            --name FM1-Mobile-Offline-APK --dir dist
          test -s dist/app-debug.apk

      - name: Verify APK identity, icon, and local firmware contents
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          import hashlib, os
          path = 'dist/app-debug.apk'
          with ZipFile(path) as apk:
              paths = set(apk.namelist())
              assert 'res/drawable-nodpi-v4/fm1_launcher.webp' in paths, 'Custom FM-1 launcher icon missing'
              assert 'assets/site/fm1_web.wasm' in paths, 'Offline synth engine missing'
              assert 'assets/site/firmwares.json' in paths, 'Offline firmware catalog missing'
              packages = [x for x in paths if x.startswith('assets/site/offline-fw/') and x.endswith('.fwsc')]
              assert len(packages) >= 1, 'No built-in FM-1 firmware packages'
              print('Included FM-1 firmware packages:', len(packages))
              print('APK SHA256:', hashlib.sha256(open(path, 'rb').read()).hexdigest())
          os.rename(path, 'dist/M-VAVE-FM1-Firmware-bundle-v0.1.2.apk')
          PY

      - name: Write versioned release notes
        run: |
          cat > dist/RELEASE-NOTES.md <<'EOF'
          # M-VAVE FM1: Firmware bundle — v0.1.2 (experimental)

          Android audio architecture update focused on **much lower note-to-speaker latency** and cleaner playback. The user-reported issue was not a lack of CPU throughput: the previous APK forced a 44.1 kHz output stream on Android, defaulted to a higher-latency audio buffer and performed unnecessary graphics allocation.

          ### Changes in v0.1.2
          - **Fast audio is the default**: `interactive` output latency hint instead of the prior `balanced` setting. Any older larger-buffer preference is migrated to fast mode once on upgrade.
          - **Respect Android's natural output sample rate** (often 48 kHz) instead of forcing Android's audio device to run at 44.1 kHz.
          - **Continuous stereo resampling in the AudioWorklet** between the FM-1's fixed 44.1 kHz firmware I2S and the Android output rate. The fractional phase is preserved between render blocks.
          - **Correct CPU budget at 44.1 kHz**, independent of Android's output sample rate, to avoid synthetic underruns.
          - **Half-size emulated audio lookahead on Android** (512 firmware samples, reduced from 1024), reducing the delay between MIDI notes and newly generated sound.
          - **Lower main-thread graphics overhead**: reuse LCD/panel buffers and cap expensive Android redraws so MIDI/keys don't compete with frequent canvas allocations.
          - **Native Audio button** with Fast, Balanced and Playback modes and an indication of the Android native output rate; a larger buffer remains optional for devices that need it.
          - Maintains the existing Android JIT compilation safeguards and separates startup silence from post-start audio underruns.
          - New regression tests check 44.1→48 kHz stereo continuity, accurate timing and buffer defaults.

          ### Listening guidance
          For **playing notes live**, use a wired USB-C audio interface or wired headphones and the **Fast** mode. Bluetooth A2DP speakers inherently introduce additional buffering and latency that an emulator cannot eliminate.

          **Limits:** This remains a WebAssembly/AudioWorklet prototype, not an Oboe/AAudio native synthesizer. It has not yet been benchmarked end-to-end on the specific physical phone or with the CTL-1 MIDI hardware, so identical performance to the real FM-1 is not yet established.

          Retains the orange FM-1 launcher artwork and the offline firmware bundle.

          ### Features
          - WebAssembly-based FM-1 firmware emulation and audio generation on Android.
          - **92 FM-1 community firmwares** bundled locally, plus 9 SMK-37 firmwares in the packaged catalog.
          - Switch between compatible emulated firmwares **without reflashing the physical M-VAVE FM-1**.
          - Dedicated native Android buttons for **Iniciar firmware**, **Panel**, **Pantalla** and **MIDI**.
          - FM-1 LCD view designed for landscape use; imported local `.fwsc` firmware packages supported.
          - Native Android MIDI input through USB MIDI or BLE MIDI; audio uses the phone's active system output, including Bluetooth/USB-C when supported.
          - No Android Internet permission: bundled components and included firmwares function offline.

          ### Install
          Download **M-VAVE-FM1-Firmware-bundle-v0.1.2.apk**, transfer it to Android and open it to install.
          If an older development build has a different signature, export saved presets and uninstall the older build first.

          ### Important limitations
          - **Experimental, unsigned for production:** APK is a debug/development build, not a Google Play release.
          - The end-to-end FM-1 / CTL-1 MIDI controller connection still requires real-device validation.
          - Firmware performance depends on Android device, JIT warmup and audio buffer selection; some programs may run slowly.
          - Proprietary stock M-VAVE firmware is **not distributed**: import your own `FM-1.fwsc` locally.
          - This is an **unofficial community project**, not affiliated with M-VAVE.
          - The emulator's automated boot/audio checks pass; a completed hardware acceptance test on a physical Android phone is not yet available.

          **Try in browser (GitHub Pages):** https://koolkatze.github.io/Bluetooth-control-multi-firmware-m-vave-fm1-fm1-emu/?screen=1&fit=1

          **Source / README:** https://github.com/Koolkatze/Bluetooth-control-multi-firmware-m-vave-fm1-fm1-emu
          EOF

      - name: Publish public GitHub release with the actual APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.2 \
            "dist/M-VAVE-FM1-Firmware-bundle-v0.1.2.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target master \
            --title "M-VAVE FM1: Firmware bundle" \
            --notes-file dist/RELEASE-NOTES.md \
            --prerelease

      - name: Verify published release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.1.2 --repo "$GITHUB_REPOSITORY" --json name,tagName,isDraft,isPrerelease,assets \
            --jq '{name,tag: .tagName,draft: .isDraft,prerelease: .isPrerelease,assets: [.assets[].name]}'
          gh release view v0.1.2 --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | grep -Fx 'M-VAVE-FM1-Firmware-bundle-v0.1.2.apk'
