name: Publish M-VAVE FM1 firmware bundle

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/publish-fm1-release.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish APK to GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release automation
        uses: actions/checkout@v4

      - name: Fetch previously built and validated FM-1 Android APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh run download 41225298660 --repo "$GITHUB_REPOSITORY" \
            --name FM1-Mobile-Offline-APK --dir dist
          test -s dist/app-debug.apk

      - name: Verify APK identity, icon, and local firmware contents
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          import hashlib, os
          path = 'dist/app-debug.apk'
          with ZipFile(path) as apk:
              paths = set(apk.namelist())
              assert 'res/drawable-nodpi-v4/fm1_launcher.webp' in paths, 'Custom FM-1 launcher icon missing'
              assert 'lib/arm64-v8a/libfm1_android.so' in paths, 'ARM64 native Rust synthesizer missing'
              assert 'lib/x86_64/libfm1_android.so' in paths, 'x86-64 native Rust synthesizer missing'
              print('Rust AAudio shared libraries present for both ABIs')
              assert 'assets/site/fm1_web.wasm' in paths, 'Offline synth engine missing'
              assert 'assets/site/firmwares.json' in paths, 'Offline firmware catalog missing'
              packages = [x for x in paths if x.startswith('assets/site/offline-fw/') and x.endswith('.fwsc')]
              assert len(packages) >= 1, 'No built-in FM-1 firmware packages'
              print('Included FM-1 firmware packages:', len(packages))
              print('APK SHA256:', hashlib.sha256(open(path, 'rb').read()).hexdigest())
          os.rename(path, 'dist/M-VAVE-FM1-Firmware-bundle-v0.2.1.apk')
          PY

      - name: Write versioned release notes
        run: |
          cat > dist/RELEASE-NOTES.md <<'EOF'
          # M-VAVE FM1: Firmware bundle — v0.2.1 (experimental)

          ## Fix: native AAudio PCM starvation in AMB-1 and other FM-1 firmwares

          This release addresses reports of millions of samples missing from the v0.2.0 native audio engine. Large cumulative counts represented genuine failure to feed Android's audio callback, not normal latency.

          ### Changes in v0.2.1
          - The Rust FM-1 synth worker now generates PCM in **batches of up to 128 frames**, avoiding clock, MIDI, UI, and filesystem checks after every single audio sample.
          - The native audio ring targets **1024 frames** (~21ms at 48k) instead of 512; this better absorbs the FM-1's bursty DMA output and intermittent JIT compilation.
          - Before AAudio starts, the engine pre-fills at least 512 frames where the firmware produces audio in time (up to a bounded one-second boot interval).
          - The AAudio callback accumulates missing samples and updates the atomic error counter once per callback, instead of thousands of atomics per second.
          - The Android synth worker requests moderately elevated audio scheduling priority so drawing/WebView tasks are less likely to starve firmware synthesis.
          - The UI now reports **recent missing samples per second**, total missing samples, native firmware emulation speed, PCM frames produced per second, and current audio ring depth.
          - Added a real native firmware benchmark with a simulated 48kHz consumer. Under Linux CI, both **Felucca and AMB-1** each delivered 108,800 samples with **zero missing** across approximately 2.3 seconds. This is a software test, NOT a phone performance guarantee.

          ### Interpretation of the live diagnostics
          - Native emulator speed should stay at least **1.0x** and PCM throughput should stay near the device sample rate (usually 48,000 per second).
          - Missing samples / second should stay at **0** after startup, although the cumulative counter may retain historical values.
          - If native emulated speed stays below 1x on a physical Android ARM64 phone, the bottleneck may be native JIT availability or device-specific CPU scheduling; more buffer alone cannot fix that.

          ### Still experimental
          - End-to-end physical Android audio quality and latency have not been validated by the CI test; test with a wired/USB-C audio output, not Bluetooth A2DP, for live musical response.
          - Proprietary original firmware is not bundled. Native save data uses Android private storage, currently not exportable as browser .fm1save.
          - The WebAssembly engine remains an optional fallback on devices where native libraries cannot load.

          ### Features
          - WebAssembly-based FM-1 firmware emulation and audio generation on Android.
          - **92 FM-1 community firmwares** bundled locally, plus 9 SMK-37 firmwares in the packaged catalog.
          - Switch between compatible emulated firmwares **without reflashing the physical M-VAVE FM-1**.
          - Dedicated native Android buttons for **Iniciar firmware**, **Panel**, **Pantalla** and **MIDI**.
          - FM-1 LCD view designed for landscape use; imported local `.fwsc` firmware packages supported.
          - Native Android MIDI input through USB MIDI or BLE MIDI; audio uses the phone's active system output, including Bluetooth/USB-C when supported.
          - No Android Internet permission: bundled components and included firmwares function offline.

          ### Install
          Download **M-VAVE-FM1-Firmware-bundle-v0.2.1.apk**, transfer it to Android and open it to install.
          If an older development build has a different signature, export saved presets and uninstall the older build first.

          ### Important limitations
          - **Experimental, unsigned for production:** APK is a debug/development build, not a Google Play release.
          - The end-to-end FM-1 / CTL-1 MIDI controller connection still requires real-device validation.
          - Firmware performance depends on Android device, JIT warmup and audio buffer selection; some programs may run slowly.
          - Proprietary stock M-VAVE firmware is **not distributed**: import your own `FM-1.fwsc` locally.
          - This is an **unofficial community project**, not affiliated with M-VAVE.
          - The emulator's automated boot/audio checks pass; a completed hardware acceptance test on a physical Android phone is not yet available.

          **Try in browser (GitHub Pages):** https://koolkatze.github.io/Bluetooth-control-multi-firmware-m-vave-fm1-fm1-emu/?screen=1&fit=1

          **Source / README:** https://github.com/Koolkatze/Bluetooth-control-multi-firmware-m-vave-fm1-fm1-emu
          EOF

      - name: Publish public GitHub release with the actual APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.1 \
            "dist/M-VAVE-FM1-Firmware-bundle-v0.2.1.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target master \
            --title "M-VAVE FM1: Firmware bundle" \
            --notes-file dist/RELEASE-NOTES.md \
            --prerelease

      - name: Verify published release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.2.1 --repo "$GITHUB_REPOSITORY" --json name,tagName,isDraft,isPrerelease,assets \
            --jq '{name,tag: .tagName,draft: .isDraft,prerelease: .isPrerelease,assets: [.assets[].name]}'
          gh release view v0.2.1 --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | grep -Fx 'M-VAVE-FM1-Firmware-bundle-v0.2.1.apk'
