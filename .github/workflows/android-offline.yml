name: Android offline APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "tools/package_offline_android.mjs"
      - "tools/check_offline_android.mjs"
      - "tools/build_android_native.sh"
      - "web/**"
      - "urban-1/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android-offline.yml"

permissions:
  contents: write

concurrency:
  group: android-offline
  cancel-in-progress: true

jobs:
  apk:
    name: Build installable offline APK
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout emulator source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Use preinstalled Android SDK (avoid sdkmanager tools compatibility issue)
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Android SDK platform 35
        run: |
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build native Rust / AAudio synthesizer (ARM64 + x86-64)
        run: |
          cargo test -p fm1-android --lib --locked
          bash tools/build_android_native.sh

      - name: Compile WebAssembly emulator for offline packaging
        run: |
          rustup target add wasm32-unknown-unknown
          web/build.sh _offline_web

      # URBAN-1 must be a real FM-1 .fwsc built from the same source as its
      # device firmware. Bundle it locally: Android never fetches a remote
      # firmware or an expiring CI artifact to boot it.
      - name: Checkout pinned HYP-1 synthesis/firmware source for URBAN-1
        uses: actions/checkout@v4
        with:
          repository: RustyPawz/fm1-HYP1
          ref: 57c456db61826331d356458c9c1a136517da7cbf
          path: hyp1

      - name: Install HYP-1 firmware build prerequisites
        run: python3 -m pip install Pillow

      - name: Restore JieLi toolchain and AC79 SDK
        id: urban-jieli
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: urban1-jieli-ac79-v1.2.1

      - name: Fetch device compiler when not cached
        if: steps.urban-jieli.outputs.cache-hit != 'true'
        run: |
          try() { for i in 1 2 3; do "$@" && return 0; echo "retry $i"; sleep $((i * 15)); done; return 1; }
          [ -x ~/.jieli/toolchain/pi32v2/bin/clang ] || (cd hyp1 && try tools/get_toolchain.sh)
          fetch_sdk() {
            rm -rf ~/fw-AC79_AIoT_SDK
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
              https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK
          }
          [ -f ~/fw-AC79_AIoT_SDK/cpu/wl82/tools/uboot.boot ] || try fetch_sdk

      - name: Build and verify actual URBAN-1 FM-1 firmware
        run: |
          make -C urban-1 test
          python3 urban-1/tools/apply_hyp1.py --hyp-root hyp1
          (cd hyp1 && ./build.sh --release 0.1.0)
          test -s hyp1/build/amb-0.1.0.fwsc
          (cd hyp1 && cc -o build/ota_test tests/ota_test.c && build/ota_test build/amb-0.1.0.fwsc)

      - name: Bundle open-source firmwares, URBAN-1 and all web assets
        env:
          URBAN1_FWSC: hyp1/build/amb-0.1.0.fwsc
        run: node tools/package_offline_android.mjs _offline_web android/app/src/main/assets/site

      - name: Validate true native synthesizer libraries and package files
        run: |
          test -s android/app/src/main/jniLibs/arm64-v8a/libfm1_android.so
          test -s android/app/src/main/jniLibs/x86_64/libfm1_android.so
          node tools/check_offline_android.mjs android/app/src/main/assets/site

      - name: Validate local package references and offline manifest
        run: node tools/check_offline_android.mjs android/app/src/main/assets/site

      - name: Test bundled FM-1 boot and audio using its packaged firmware
        run: |
          node web/smoke.mjs _offline_web android/app/src/main/assets/site/offline-fw/$(node -p "require('./android/app/src/main/assets/site/firmwares.json').default").fwsc

      - name: Test URBAN-1 boot and LCD in the actual WebAssembly emulator
        run: |
          node web/smoke.mjs _offline_web android/app/src/main/assets/site/offline-fw/urban1.fwsc
          node -e "const c=require('./android/app/src/main/assets/site/firmwares.json');if(!c.firmwares.some(f=>f.id==='urban1'&&f.package==='offline-fw/urban1.fwsc'))process.exit(1)"

      - name: Benchmark actual native FM-1 engine with offline AMB and default firmware
        run: |
          default_id=$(node -p "require('./android/app/src/main/assets/site/firmwares.json').default")
          cargo run --release -p fm1-android --example native_bench --locked -- "android/app/src/main/assets/site/offline-fw/$default_id.fwsc"
          if test -s android/app/src/main/assets/site/offline-fw/amb.fwsc; then
            cargo run --release -p fm1-android --example native_bench --locked -- "android/app/src/main/assets/site/offline-fw/amb.fwsc"
          fi
          cargo run --release -p fm1-android --example native_bench --locked -- "android/app/src/main/assets/site/offline-fw/urban1.fwsc"

      - name: Build Android APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FM1-Mobile-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish the current Android APK to an installable GitHub release
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n "s/^[[:space:]]*versionName '\\([^']*\\)'.*/\\1/p" android/app/build.gradle | head -n1)
          test -n "$version"
          clean_version="${version%-native}"
          tag="v${clean_version}"
          mkdir -p dist
          apk="M-VAVE-FM1-Firmware-bundle-${tag}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/$apk"
          sha256sum "dist/$apk"
          cat > dist/notes.md <<EOF
          # M-VAVE FM1: Firmware bundle — ${tag} (experimental)

          This Android APK includes offline FM-1 firmware emulation, native
          Rust/AAudio synthesis and MIDI USB/BLE support.

          In v0.2.5 the Firmware tab adds two explicit update actions:
          "Actualizar seleccionado" checks the chosen firmware, while
          "Actualizar todos" checks all built-in open-source firmwares.
          When the public HTTPS catalog lists a changed version, the native
          Android updater downloads and verifies its .fwsc container, stores
          it privately, and makes it available at next selection/boot.
          No physical FM-1/SMK-37 hardware is flashed and no audio session
          is interrupted by downloading. Proprietary stock firmware and
          user-imported local packages still require manual import.
          Existing saved patches are preserved under their original SHA.

          Android now requests INTERNET permission solely for explicit
          user-initiated firmware updates; offline synth functionality
          and local resources remain available without connectivity.

          In v0.2.4, original 1:1 and horizontal 16:9 LCD layouts were
          adapted to the device viewport to prevent vertical clipping.
          In v0.2.3, the diagnostics moved behind the info button and
          the bottom native toolbar became collapsible.

          Warning: development APK. Android debug signing keys may differ
          between CI runs; updating an older development APK can require
          uninstalling it, which deletes its private saved settings.
          Export any settings possible before changing installations.
          The actual audio/MIDI latency has not been verified on all devices.
          EOF
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "dist/$apk" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "dist/$apk" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "M-VAVE FM1: Firmware bundle — $tag" \
              --notes-file dist/notes.md --prerelease
          fi

      - name: Upload offline firmware provenance
        uses: actions/upload-artifact@v4
        with:
          name: FM1-Offline-Firmware-Manifest
          path: |
            android/app/src/main/assets/site/offline-bundle-report.json
            android/app/src/main/assets/site/OFFLINE-FIRMWARES.md
          retention-days: 30

  emulator-smoke:
    name: Test actual APK on Android emulator
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download built offline APK
        uses: actions/download-artifact@v4
        with:
          name: FM1-Mobile-Offline-APK
          path: apk

      - name: Boot virtual Android and inspect visible controls
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r apk/app-debug.apk
            adb shell am start -n com.koolkatze.fm1offline/.MainActivity
            sleep 14
            adb exec-out screencap -p > android-before-start.png
            adb shell uiautomator dump /sdcard/fm1-view.xml
            adb pull /sdcard/fm1-view.xml android-ui.xml
            # In compact mode the native toolbar must be invisible by default.
            grep -q 'Mostrar controles' android-ui.xml
            grep -q 'Datos de sonido' android-ui.xml
            if grep -q 'Iniciar firmware' android-ui.xml; then
              echo "The bulky control bar must start collapsed"
              exit 1
            fi
            # Open the native diagnostic dialog and verify real WebView
            # readiness is shown there, not in a permanent status footer.
            python3 - <<'PY'
            import re, subprocess, xml.etree.ElementTree as ET
            root = ET.parse('android-ui.xml').getroot()
            def tap(label):
                matches = [node for node in root.iter('node')
                           if node.get('content-desc') == label]
                assert matches, f'Missing visible {label} button'
                coordinates = list(map(int, re.findall(r'\d+', matches[0].get('bounds', ''))))
                assert len(coordinates) == 4, 'Missing coordinates'
                subprocess.run(['adb', 'shell', 'input', 'tap',
                    str((coordinates[0] + coordinates[2]) // 2),
                    str((coordinates[1] + coordinates[3]) // 2)], check=True)
            tap('Datos de sonido')
            PY
            sleep 1
            adb shell uiautomator dump /sdcard/fm1-info-ui.xml
            adb pull /sdcard/fm1-info-ui.xml android-info-ui.xml
            grep -q 'Preparado' android-info-ui.xml
            adb shell input keyevent 4
            # The compact chevron must restore the original full toolbar.
            python3 - <<'PY'
            import re, subprocess, xml.etree.ElementTree as ET
            root = ET.parse('android-ui.xml').getroot()
            nodes = [n for n in root.iter('node') if n.get('content-desc') == 'Mostrar controles']
            assert nodes, 'Chevron missing'
            nums = list(map(int, re.findall(r'\d+', nodes[0].get('bounds', ''))))
            assert len(nums) == 4
            subprocess.run(['adb','shell','input','tap',
                str((nums[0]+nums[2])//2),str((nums[1]+nums[3])//2)], check=True)
            PY
            sleep 1
            adb shell uiautomator dump /sdcard/fm1-expanded-ui.xml
            adb pull /sdcard/fm1-expanded-ui.xml android-expanded-ui.xml
            grep -q 'Ocultar controles' android-expanded-ui.xml
            grep -q 'Iniciar firmware' android-expanded-ui.xml
            grep -q 'Pantalla' android-expanded-ui.xml
            adb logcat -d -s FM1Mobile:E > android-errors.log
            if grep -E 'WebView:.*(Uncaught|Failed to fetch|404|SyntaxError)' android-errors.log; then
              echo "WebView reported a fatal resource/JS error"
              exit 1
            fi

      - name: Upload Android emulator screenshot and diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FM1-Android-UI-Test
          path: |
            android-before-start.png
            android-ui.xml
            android-info-ui.xml
            android-expanded-ui.xml
            android-errors.log
          if-no-files-found: warn
          retention-days: 30
