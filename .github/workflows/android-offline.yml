name: Android offline APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "tests/**"
      - "tools/package_offline_android.mjs"
      - "tools/check_offline_android.mjs"
      - "tools/android_emulator_smoke.sh"
      - "tools/build_android_native.sh"
      - "web/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android-offline.yml"

permissions:
  contents: write

concurrency:
  group: android-offline
  cancel-in-progress: true

jobs:
  apk:
    name: Build installable offline APK
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout emulator source
        uses: actions/checkout@v4

      - name: Fetch current FW Hub catalogue for Workbench
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Import every current FW Hub firmware for Workbench
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node tools/hub_catalog.mjs
          node --check tools/hub_catalog.mjs
          node --check tools/package_offline_android.mjs
          node --check tools/check_offline_android.mjs
          node --input-type=module --check < web/main.js
          node -e 'const c=require("./web/firmwares.json");const u=c.firmwares.find(x=>x.id==="urban1");if(!u||!u.package||!u.package.includes("urban1-firmware-v")) process.exit(1);console.log("Current Hub entries:",c.firmwares.length,"URBAN:",u.version)'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Test FM-1 MIDI controller-to-panel mapping (no Android emulator required)
        run: |
          mkdir -p .midi-tests
          javac -d .midi-tests \
            android/app/src/main/java/com/koolkatze/fm1offline/MidiPanelMapper.java \
            tests/MidiPanelMapperTest.java
          java -cp .midi-tests com.koolkatze.fm1offline.MidiPanelMapperTest

      - name: Test physical FM-1 firmware install protocol and risk guardrails
        run: |
          mkdir -p .ota-tests
          javac -d .ota-tests \
            android/app/src/main/java/com/koolkatze/fm1offline/Fm1OtaProtocol.java \
            tests/Fm1OtaProtocolTest.java
          java -cp .ota-tests com.koolkatze.fm1offline.Fm1OtaProtocolTest

      - name: Verify Workbench Remote CTL-1 patch against pinned upstream source
        run: |
          python3 -m py_compile tools/patch_ctl1_workbench.py
          mkdir -p /tmp/ctl1-workbench-validation/app
          curl --fail --location --silent --show-error --retry 3 \
            https://raw.githubusercontent.com/charlesvestal/fm1-ctl/772b90f8e7d84fb8f87d51857f2289cc6aac8e32/app/ui.c \
            -o /tmp/ctl1-workbench-validation/app/ui.c
          python3 tools/patch_ctl1_workbench.py /tmp/ctl1-workbench-validation --dry-run
          python3 tools/patch_ctl1_workbench.py /tmp/ctl1-workbench-validation
          python3 - <<'PY'
          from pathlib import Path
          source = Path('/tmp/ctl1-workbench-validation/app/ui.c').read_text()
          assert '#define WB_REMOTE_ONLY 1' in source
          assert 'wb_remote_input();' in source
          assert '#if WB_REMOTE_ONLY' in source
          assert '80 + ((button + 2) % NB)' in source
          assert '{94, 96, 95, 97, 98, 99, 100}' in source
          assert '102u, 42u' in source
          assert source.count('#if WB_REMOTE_ONLY') == 1
          assert source.count('#endif') >= 1
          print('CTL-1 Workbench Remote patch anchors verified')
          PY

      - name: Use preinstalled Android SDK (avoid sdkmanager tools compatibility issue)
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Android SDK platform 35
        run: |
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build native Rust / AAudio synthesizer (ARM64 + x86-64)
        run: |
          cargo test -p fm1-android --lib --locked
          bash tools/build_android_native.sh

      - name: Compile WebAssembly emulator for offline packaging
        run: |
          rustup target add wasm32-unknown-unknown
          web/build.sh _offline_web

      - name: Bundle open-source firmware packages and all web assets
        run: node tools/package_offline_android.mjs _offline_web android/app/src/main/assets/site

      - name: Validate true native synthesizer libraries and package files
        run: |
          test -s android/app/src/main/jniLibs/arm64-v8a/libfm1_android.so
          test -s android/app/src/main/jniLibs/x86_64/libfm1_android.so
          node tools/check_offline_android.mjs android/app/src/main/assets/site
          node - <<'NODE'
          const c = require("./android/app/src/main/assets/site/firmwares.json");
          const u = c.firmwares.find(f => f.id === "urban1");
          if (!u || !u.package?.startsWith("offline-fw/"))
            throw Error("URBAN-1 must be packaged as a real offline .fwsc in Workbench");
          if (c.firmwares.length < 97)
            throw Error("Workbench must retain all existing FM-1 Hub entries");
          console.log("Workbench entries:", c.firmwares.length, "including URBAN-1", u.version);
          NODE

      - name: Validate local package references and offline manifest
        run: node tools/check_offline_android.mjs android/app/src/main/assets/site

      - name: Test bundled FM-1 boot and audio using its packaged firmware
        run: |
          node web/smoke.mjs _offline_web android/app/src/main/assets/site/offline-fw/$(node -p "require('./android/app/src/main/assets/site/firmwares.json').default").fwsc

      - name: Benchmark actual native FM-1 engine with offline AMB and default firmware
        run: |
          default_id=$(node -p "require('./android/app/src/main/assets/site/firmwares.json').default")
          cargo run --release -p fm1-android --example native_bench --locked -- "android/app/src/main/assets/site/offline-fw/$default_id.fwsc"
          if test -s android/app/src/main/assets/site/offline-fw/amb.fwsc; then
            cargo run --release -p fm1-android --example native_bench --locked -- "android/app/src/main/assets/site/offline-fw/amb.fwsc"
          fi

      - name: Build Android APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FM1-Mobile-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish the current Android APK to an installable GitHub release
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n "s/^[[:space:]]*versionName '\\([^']*\\)'.*/\\1/p" android/app/build.gradle | head -n1)
          test -n "$version"
          clean_version="${version%-native}"
          tag="v${clean_version}"
          mkdir -p dist
          apk="FM-1-Workbench-${tag}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/$apk"
          sha256sum "dist/$apk"
          cat > dist/notes.md <<EOF
          # FM-1 Workbench — ${tag} (experimental)

          This Android APK includes offline FM-1 firmware emulation, native
          Rust/AAudio synthesis and MIDI USB/BLE support.

          In v0.2.12, Firmware adds "Instalar firmware seleccionado en FM-1",
          separate from updating emulator packages. Every selected FM-1
          compatible .fwsc can be staged, including custom imports.
          Physical flashing is USB MIDI only; the installer verifies
          SHA-256 and FM-1 package identity, probes the real device,
          and asks "Are you sure? Install custom firmware at your own
          risk" BEFORE writing. The M-UPGRADE implementation serves
          check/read/write requests, handles loader reconnection,
          verifies the rebooted identity, and reports progress and
          failures. It rejects mismatched SMK-37 firmware and missing
          required loader markers. Flashing is NEVER automatic, and
          has NOT been tested on physical hardware; have a rescue
          method ready. Complementary -res.bin resource installation
          is not implemented.

          In v0.2.10, SELECT, PRESETS, ALGORITHM, KNOB1-4, MASTER,
          OCT-/OCT+ and every FX, SEL, ENV, LFO, EDIT, GLO, HOME,
          SAVE, ARP, SEQ, PLAY/STOP and REC switch now have an exact
          hardware event in Workbench Remote v1. The optional CTL-1
          source adapter is a dedicated controller mode, preventing
          CTL-1's own local actions, musical transport and CCs from
          double-triggering virtual firmware functions. AUTO recognizes
          the Remote CC102/42 handshake on both USB and BLE, including
          reconnects and held-state recovery. Explicit CTL-1 retains
          limited compatibility; sustain CC64 and panic CC123 no
          longer masquerade as ENV/REC and MIDI Start/Stop no longer
          fakes PLAY button presses. MIDI Diagnostics now identifies
          each last mapped physical control. The source adapter is
          NOT a flashed or hardware-tested physical firmware binary.

          In v0.2.9, the MIDI button includes a mapping profile for the
          CTL-1 currently installed in a physical M-VAVE FM-1, with MIDI
          notes, its four banked knobs, program changes, transport, sustain
          and an optional MASTER CC11 mapped to actual panel controls.
          The same USB/BLE dispatcher supports Workbench Remote v1 for
          all 14 buttons, 7 encoders, MASTER and 27 keys; this complete
          mode requires firmware on the physical FM-1 implementing that
          MIDI protocol. Standard CTL-1 does not emit every button event.
          Held keys are released safely on disconnect, and Java tests
          check running status, realtime MIDI, note routes and mapping.
          See docs/midi-mapping.md for the exact control table.

          In v0.2.8, Workbench (com.koolkatze.fm1offline) remains ONE
          standalone application with URBAN-1 inside its firmware catalog,
          not a separate URBAN-1 APK. BLE MIDI now discovers FM-1 adverts
          even when the MIDI UUID is absent from the first advertising frame
          and connects with stale session protection. MIDI Diagnostics
          shows the actual count of inbound MIDI messages/bytes and route.

          The firmware tab imports the live FM-1 Firmware Hub catalog.
          Previously missing Hub entries are discoverable, including
          link-only cards that cannot be mirrored legally. Native Update
          All can download new open-source firmware IDs; the catalog
          persists across Workbench restarts. URBAN-1 is verified as
          an installed offline .fwsc in the APK before publishing.

          In v0.2.7, fixes a firmware-update persistence issue:
          the original APK's bundled catalog could display URBAN-1 v0.3.4
          again on app restart even after installing a newer .fwsc.
          The UI now restores version badges from Android's persistent
          installed.json, loads valid installed packages before old
          IndexedDB snapshots, refuses silent fallback to stale firmware
          when a saved update is corrupt, and validates local files.
          The updater can redownload a package when its URL changes even
          if its version does not. The new APK bundles the current
          URBAN-1 v0.3.9 firmware if available at packaging time.
          This is an emulator-only update, not a hardware flash.

          In v0.2.5 the Firmware tab adds two explicit update actions:
          "Actualizar seleccionado" checks the chosen firmware, while
          "Actualizar todos" checks all built-in open-source firmwares.
          When the public HTTPS catalog lists a changed version, the native
          Android updater downloads and verifies its .fwsc container, stores
          it privately, and makes it available at next selection/boot.
          No physical FM-1/SMK-37 hardware is flashed and no audio session
          is interrupted by downloading. Proprietary stock firmware and
          user-imported local packages still require manual import.
          Existing saved patches are preserved under their original SHA.

          Android now requests INTERNET permission solely for explicit
          user-initiated firmware updates; offline synth functionality
          and local resources remain available without connectivity.

          In v0.2.4, original 1:1 and horizontal 16:9 LCD layouts were
          adapted to the device viewport to prevent vertical clipping.
          In v0.2.3, the diagnostics moved behind the info button and
          the bottom native toolbar became collapsible.

          Warning: development APK. Android debug signing keys may differ
          between CI runs; updating an older development APK can require
          uninstalling it, which deletes its private saved settings.
          Export any settings possible before changing installations.
          The actual audio/MIDI latency has not been verified on all devices.
          EOF
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "dist/$apk" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "dist/$apk" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "FM-1 Workbench — $tag" \
              --notes-file dist/notes.md --prerelease
          fi

      - name: Upload offline firmware provenance
        uses: actions/upload-artifact@v4
        with:
          name: FM1-Offline-Firmware-Manifest
          path: |
            android/app/src/main/assets/site/offline-bundle-report.json
            android/app/src/main/assets/site/OFFLINE-FIRMWARES.md
          retention-days: 30

  emulator-smoke:
    name: Test actual APK on Android emulator
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download built offline APK
        uses: actions/download-artifact@v4
        with:
          name: FM1-Mobile-Offline-APK
          path: apk

      # Hosted Ubuntu supplies /dev/kvm, but the runner user is not always
      # a member of the kvm group. Without access, reactivecircus silently
      # switches to unaccelerated x86 emulation and Android never finishes
      # booting (the "Timeout waiting for emulator to boot" error).
      - name: Enable KVM acceleration for Android AVD
        run: |
          set -euo pipefail
          test -c /dev/kvm || { echo "::error::Hosted runner has no /dev/kvm; cannot run the x86 Android UI test"; exit 1; }
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm

      - name: Boot virtual Android and inspect visible controls
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash tools/android_emulator_smoke.sh

      - name: Upload Android emulator screenshot and diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FM1-Android-UI-Test
          path: |
            android-before-start.png
            android-ui.xml
            android-info-ui.xml
            android-expanded-ui.xml
            android-errors.log
          if-no-files-found: warn
          retention-days: 30
