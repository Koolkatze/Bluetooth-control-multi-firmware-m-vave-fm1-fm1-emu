name: Android offline APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "tools/package_offline_android.mjs"
      - "tools/check_offline_android.mjs"
      - "tools/build_android_native.sh"
      - "web/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android-offline.yml"

permissions:
  contents: read

concurrency:
  group: android-offline
  cancel-in-progress: true

jobs:
  apk:
    name: Build installable offline APK
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout emulator source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Use preinstalled Android SDK (avoid sdkmanager tools compatibility issue)
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Android SDK platform 35
        run: |
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build native Rust / AAudio synthesizer (ARM64 + x86-64)
        run: |
          cargo test -p fm1-android --lib --locked
          bash tools/build_android_native.sh

      - name: Compile WebAssembly emulator for offline packaging
        run: |
          rustup target add wasm32-unknown-unknown
          web/build.sh _offline_web

      - name: Bundle open-source firmware packages and all web assets
        run: node tools/package_offline_android.mjs _offline_web android/app/src/main/assets/site

      - name: Validate true native synthesizer libraries and package files
        run: |
          test -s android/app/src/main/jniLibs/arm64-v8a/libfm1_android.so
          test -s android/app/src/main/jniLibs/x86_64/libfm1_android.so
          node tools/check_offline_android.mjs android/app/src/main/assets/site

      - name: Validate local package references and offline manifest
        run: node tools/check_offline_android.mjs android/app/src/main/assets/site

      - name: Test bundled FM-1 boot and audio using its packaged firmware
        run: |
          node web/smoke.mjs _offline_web android/app/src/main/assets/site/offline-fw/$(node -p "require('./android/app/src/main/assets/site/firmwares.json').default").fwsc

      - name: Build Android APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FM1-Mobile-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload offline firmware provenance
        uses: actions/upload-artifact@v4
        with:
          name: FM1-Offline-Firmware-Manifest
          path: |
            android/app/src/main/assets/site/offline-bundle-report.json
            android/app/src/main/assets/site/OFFLINE-FIRMWARES.md
          retention-days: 30

  emulator-smoke:
    name: Test actual APK on Android emulator
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download built offline APK
        uses: actions/download-artifact@v4
        with:
          name: FM1-Mobile-Offline-APK
          path: apk

      - name: Boot virtual Android and inspect visible controls
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r apk/app-debug.apk
            adb shell am start -n com.koolkatze.fm1offline/.MainActivity
            sleep 14
            adb exec-out screencap -p > android-before-start.png
            adb shell uiautomator dump /sdcard/fm1-view.xml
            adb pull /sdcard/fm1-view.xml android-ui.xml
            cat android-ui.xml | sed 's/></>\\n</g' | grep -E 'Iniciar firmware|Panel|Pantalla|Preparado|Error' | head -35
            grep -q 'Iniciar firmware' android-ui.xml
            grep -q 'Pantalla' android-ui.xml
            # The module-ready callback proves that the WebAssembly/local
            # assets loaded. A plain native toolbar alone is not enough.
            grep -q 'Preparado' android-ui.xml
            adb logcat -d -s FM1Mobile:E > android-errors.log
            if grep -E 'WebView:.*(Uncaught|Failed to fetch|404|SyntaxError)' android-errors.log; then
              echo "WebView reported a fatal resource/JS error"
              exit 1
            fi

      - name: Upload Android emulator screenshot and diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FM1-Android-UI-Test
          path: |
            android-before-start.png
            android-ui.xml
            android-errors.log
          if-no-files-found: warn
          retention-days: 30
