name: Publish URBAN-1 Android APK direct download

on:
  push:
    branches: [feature/urban-1]
    paths:
      - .github/workflows/urban-1-apk-download.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Create persistent public APK release
    runs-on: ubuntu-24.04
    steps:
      - name: Download the previously built and validated APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p dist
          gh run download 41361720263 --repo "$GH_REPO" --name FM1-Mobile-Offline-APK --dir dist
          test -s dist/app-debug.apk
          unzip -t dist/app-debug.apk | tail -n 2
          unzip -Z1 dist/app-debug.apk | grep -qx 'assets/site/offline-fw/urban1.fwsc'
          mv dist/app-debug.apk dist/FM1-Mobile-URBAN1-v0.2.6-controles-corregidos.apk
          (cd dist && sha256sum FM1-Mobile-URBAN1-v0.2.6-controles-corregidos.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - name: Publish public direct download on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="urban1-android-v0.2.6-controls-fixed"
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$tag" dist/FM1-Mobile-URBAN1-v0.2.6-controles-corregidos.apk dist/SHA256SUMS.txt --repo "$GH_REPO" --clobber
          else
            gh release create "$tag" dist/FM1-Mobile-URBAN1-v0.2.6-controles-corregidos.apk dist/SHA256SUMS.txt \
              --repo "$GH_REPO" --target "$GITHUB_SHA" \
              --title "URBAN-1 Android v0.2.6 – botones corregidos" \
              --notes "APK experimental para Android. Corrige la pérdida de pulsaciones rápidas (PLAY, HOME, SEQ, SAVE) en el emulador nativo y sincroniza el estado del motor HYP-1. Incluye URBAN-1 sin conexión. No instala firmware en el FM-1 físico. APK firmada con clave de desarrollo; guarda tus datos antes de reinstalar." \
              --prerelease
          fi
          gh release view "$tag" --repo "$GH_REPO" --json url,assets --jq '.url, (.assets[] | .name + " " + .url)'
