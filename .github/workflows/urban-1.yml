name: URBAN-1 host synthesis smoke test
on:
  push:
    branches: [feature/urban-1, feature/urban-rec-full-instruments, fix/urban-rec-audition-octave, feature/urban-kitsune-splash, fix/urban-kitsune-no-crop-v014, fix/urban-splash-fullframe-v0414, feature/urban-splash-approved-square-v0416, feature/urban-lofi-hiphop-study-jazz-sleep-v0417]
    paths:
      - 'urban-1/**'
      - '.github/workflows/urban-1.yml'
  workflow_dispatch:
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout URBAN-1 sources
        uses: actions/checkout@v4
      - name: Checkout pinned HYP-1 source (GPL-3.0)
        uses: actions/checkout@v4
        with:
          repository: RustyPawz/fm1-HYP1
          ref: 57c456db61826331d356458c9c1a136517da7cbf
          path: hyp1
      - name: Install HYP-1 host font generator dependency
        run: python3 -m pip install Pillow
      - name: Run URBAN-1 native unit tests
        run: make -C urban-1 test
      - name: Apply integration patch and build real HYP-1 DSP host
        run: |
          python3 urban-1/tools/apply_hyp1.py --hyp-root hyp1
          cd hyp1
          sh host/build_host.sh
      - name: Simulate panel input and record synthesized audio
        run: |
          mkdir -p hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_smoke.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_controls.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_song_mode.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_firmware_only.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_subgenre_live.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_scales.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_sfx.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_pianist.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_jazz_instruments.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_lofi_hiphop.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_jazz_modulation.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_jazz_bass.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_ambient_chords.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_trance_clock.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_recorder.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_rec_instrument_catalog.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_rec_audition_octave.amb hyp1/build/urban
          # Normal host smoke tests bypass the boot cover; a second build
          # runs real LCD and button transitions, as on the Android firmware.
          cc -O2 -ffp-contract=off -std=c99 -Wall -Wextra -Wno-unused-function -Wno-unused-parameter \
            -DEN_HOST -DURBAN_SPLASH_TEST -D_POSIX_C_SOURCE=200809L \
            -Ihyp1/firmware/src -Ihyp1/firmware/src/dsp -Ihyp1/build/gen \
            -o hyp1/build/host/amb_splash_host hyp1/host/amb_host.c hyp1/firmware/src/dsp/amb.c -lm
          hyp1/build/host/amb_splash_host urban-1/tests/hyp1_kitsune_splash.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_tape_transport.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_style_fx_reset.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_echo_wet.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_filter_knobs.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_polychords.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_display_stable.amb hyp1/build/urban
          python3 - <<'PY'
          from PIL import Image,ImageChops
          from pathlib import Path
          d=Path('hyp1/build/urban')
          a=Image.open(d/'urban-kitsune-cover.png').convert('RGB')
          b=Image.open(d/'urban-kitsune-cover-still.png').convert('RGB')
          g=Image.open(d/'urban-kitsune-glitch-exit.png').convert('RGB')
          h=Image.open(d/'urban-kitsune-home.png').convert('RGB')
          assert a.size == b.size == g.size == h.size == (240,240)
          assert ImageChops.difference(a,b).getbbox() is None, 'Splash flickers when idle'
          assert ImageChops.difference(a,g).getbbox() is not None, 'Exit glitch missing'
          assert ImageChops.difference(a,h).getbbox() is not None, 'Splash did not exit'
          orange=sum(1 for r,gg,bb in a.getdata() if r>120 and r>gg*1.25 and gg>25)
          assert orange>2500, f'Original orange Kitsune pixels missing: {orange}'
          # The newest USER-APPROVED illustration is the square Kitsune
          # AND rider image, shown native 240x240 with no letterboxing.
          from pathlib import Path
          import re
          header=Path('urban-1/integrations/urban_splash_art.h').read_text()
          assert '1254x1254' in header and 'SOURCE_W 240u' in header
          assert 'SOURCE_H 240u' in header and 'IMAGE_Y 0u' in header
          paltext=header.split('static const uint16_t urban_splash_palette[64]',1)[1].split('};',1)[0]
          palette=[int(h,16) for h in re.findall(r'0x([0-9a-fA-F]{4})',paltext)]
          assert len(palette)==64
          src=header.split('static const char urban_splash_image_b64[] =',1)[1].split(';',1)[0]
          symbols=''.join(re.findall(r'"([A-Za-z0-9+/]+)"',src))
          assert len(symbols)==240*240
          alpha='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          def rgb565(c):
              return ((c>>11&31)*255//31, (c>>5&63)*255//63, (c&31)*255//31)
          # LCD capture must faithfully show the full source at screen
          # edges, all corners, and the fox/biker (not a center crop).
          for x,y in [(0,0),(239,0),(0,239),(239,239),
                      (8,30),(22,185),(103,60),(125,125),
                      (198,41),(226,201),(120,238)]:
              expected=rgb565(palette[alpha.index(symbols[y*240+x])])
              actual=a.getpixel((x,y))
              assert max(abs(int(p)-int(q)) for p,q in zip(expected,actual))<=9, (
                  f'Pixel missing/altered at {x},{y}: {actual}, expected {expected}')
          for y in [0,1,10,52,120,188,230,239]:
              assert len(set(a.crop((0,y,240,y+1)).getdata()))>7, (
                  f'LCD image row {y} is blank/letterboxed')
          colors=a.getcolors(240*240)
          assert colors is not None and len(colors)>=40, '64-color graphic lost detail'
          assert orange>6500, f'Fox/rider approved orange palette lost: {orange}'
          print('Approved square Kitsune+rider full-bleed 240x240, glitch-in/out and LCD pixel exactness pass:',orange)
          PY
          python3 - <<'PY'
          import wave
          from pathlib import Path
          path=Path('hyp1/build/urban/urban.wav')
          with wave.open(str(path),'rb') as audio:
              frames=audio.readframes(audio.getnframes())
              assert audio.getnframes()>44100, 'recording too short'
              assert any(b!=0 for b in frames), 'audio is silent'
              print('URBAN-1 HYP-1 host audio frames:', audio.getnframes())
          PY
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageChops
          root=Path('hyp1/build/urban')
          for a,b in [('urban-idle-a.png','urban-idle-b.png'),
                      ('urban-tracks-a.png','urban-tracks-b.png')]:
              im1=Image.open(root/a).convert('RGB')
              im2=Image.open(root/b).convert('RGB')
              assert im1.size==im2.size, f'{a}: changed display geometry'
              assert ImageChops.difference(im1,im2).getbbox() is None, (
                  f'{a}: idle LCD framebuffer changed or flickered')
              width,height=im1.size
              px=list(im1.getdata())
              pitchblack=sum(1 for r,g,b in px if max(r,g,b)<4)
              assert pitchblack<0.05*len(px), (
                  f'{a}: {pitchblack} unexpectedly pure-black screen pixels')
              print(f'URBAN-1 LCD idle stable: {a} {width}x{height}; '
                    f'{pitchblack} black pixels / {len(px)}')
          source=Path('urban-1/integrations/urban_hyp_port.h').read_text()
          frame=source.split('static void urban_port_frame(void) {',1)[1]
          assert 'lcd_fill(' not in frame, 'Full-screen clear reintroduced'
          assert 'draw_text_box(' not in frame, 'Per-label black background reintroduced'
          assert 'cv_begin(240,144' in frame and 'cv_begin(240,96' in frame
          print('URBAN-1 display dirty-state / two-band compositing checks OK')
          PY
      - name: Archive host recording and UI screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urban1-host-smoke
          path: |
            hyp1/build/urban/
            hyp1/build/host/amb_host
          if-no-files-found: ignore
