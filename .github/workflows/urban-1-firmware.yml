name: URBAN-1 experimental FM-1 firmware
on:
  push:
    branches: [feature/urban-1]
    paths:
      - 'urban-1/**'
      - '.github/workflows/urban-1-firmware.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
# One release upload at a time; old runs must never replace a newer
# firmware while Update All reads the canonical GitHub asset.
concurrency:
  group: urban1-firmware-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: RustyPawz/fm1-HYP1
          ref: 57c456db61826331d356458c9c1a136517da7cbf
          path: hyp1
      - name: Install firmware build dependencies
        run: python3 -m pip install Pillow
      - name: Restore JieLi cross-toolchain and SDK
        id: tools
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: urban1-jieli-ac79-v1.2.1
      - name: Fetch device build tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          try() { for i in 1 2 3; do "$@" && return 0; echo "Retry $i"; sleep $((i * 15)); done; return 1; }
          [ -x ~/.jieli/toolchain/pi32v2/bin/clang ] || (cd hyp1 && try tools/get_toolchain.sh)
          fetch_sdk() {
            rm -rf ~/fw-AC79_AIoT_SDK
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK
          }
          [ -f ~/fw-AC79_AIoT_SDK/cpu/wl82/tools/uboot.boot ] || try fetch_sdk
      - name: Save device build tools
        if: steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: urban1-jieli-ac79-v1.2.1
      - name: Verify composer, genre lead, full FX and real HYP-1 host transport BEFORE publication
        run: |
          make -C urban-1 test
          python3 urban-1/tools/apply_hyp1.py --hyp-root hyp1
          (cd hyp1 && sh host/build_host.sh)
          mkdir -p hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_smoke.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_controls.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_song_mode.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_firmware_only.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_polychords.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_display_stable.amb hyp1/build/urban
      - name: Apply URBAN-1 and compile actual FM-1 package
        run: |
          cd hyp1
          ./build.sh --release 0.3.3
          test -s build/amb-0.3.3.fwsc
          cp build/amb-0.3.3.fwsc build/URBAN-1-v0.3.3-SUBGENRE-DRUM-BASS-HARMONY.fwsc
      - name: Verify package with HYP-1 updater tests
        run: |
          cd hyp1
          cc -o build/ota_test tests/ota_test.c
          build/ota_test build/amb-0.3.3.fwsc
          python3 tests/install_test.py
      - name: Publish untested experimental firmware as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: URBAN-1-v0.3.3-firmware-only
          path: hyp1/build/URBAN-1-v0.3.3-SUBGENRE-DRUM-BASS-HARMONY.fwsc
          if-no-files-found: error

      - name: Publish permanent firmware-only download (GitHub Releases)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          fw="hyp1/build/URBAN-1-v0.3.3-SUBGENRE-DRUM-BASS-HARMONY.fwsc"
          test -s "$fw"
          (cd hyp1/build && sha256sum URBAN-1-v0.3.3-SUBGENRE-DRUM-BASS-HARMONY.fwsc > SHA256SUMS-URBAN1-v0.3.3.txt)
          tag="urban1-firmware-v0.3.3"
          notes="FIRMWARE ONLY v0.3.3: authentic, separate six-lane drum partitures for 56 named subgenres; distinct subgenre bass note grammars (sliding 808/drill, low drones/ambient, walking jazz, rubber jump-up, Reese/neurofunk, offbeat techno and trance), durations, accents, octave motion and glides. Fix bass instrument selection: previously a generic genre-wide random pool overrode named substyle presets; now all 56 subgenres have their own curated four-sound HYP DRONE banks. 56 subgenre-specific four-bar chord progressions, colour/voicings, rhythmic chord placements and modal scales. KNOB3 immediately recomputes actual chord timeline, bass notes and drum patterns, not just an LCD label; individual track genre edits no longer replace the global song genre on next SAVE. Continues v0.3.2's genre-tailored leads, common rhythm grid, always-on FX and flicker-free LCD. Firmware .fwsc tested with 56-style/84-pair identity comparisons, host music/synthesis/UI regression and hardware cross-compiler; physical FM-1 not tested. Existing FM-1 Mobile -> Firmware -> Actualizar todo. NO APK changes. GPL-3.0-only."
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$tag" "$fw" hyp1/build/SHA256SUMS-URBAN1-v0.3.3.txt --repo "$GH_REPO" --clobber
          else
            gh release create "$tag" "$fw" hyp1/build/SHA256SUMS-URBAN1-v0.3.3.txt \
              --repo "$GH_REPO" --target "$GITHUB_SHA" \
              --title "URBAN-1 v0.3.3 – Subgenre Drums, Bass and Harmony" \
              --notes "$notes" --prerelease
          fi
          gh release view "$tag" --repo "$GH_REPO" --json assets,url \
            --jq '.url, (.assets[] | .name + " " + .url)'

      - name: Notify Android Update All catalog of new URBAN-1 firmware
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Workflow_dispatch may be invoked by GITHUB_TOKEN, unlike normal
          # release:published events; this is required for cross-workflow
          # updates of master/web/firmwares.json when GitHub Actions creates
          # the firmware release.
          gh workflow run sync-urban1-firmware.yml --repo "$GH_REPO" --ref master -f tag=urban1-firmware-v0.3.3
          echo "Triggered updater-catalog sync on master (APK untouched)."
