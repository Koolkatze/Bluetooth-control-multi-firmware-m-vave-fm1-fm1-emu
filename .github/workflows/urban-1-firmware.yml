name: URBAN-1 experimental FM-1 firmware
on:
  push:
    branches: [feature/urban-1]
    paths:
      - 'urban-1/**'
      - '.github/workflows/urban-1-firmware.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
# One release upload at a time; old runs must never replace a newer
# firmware while Update All reads the canonical GitHub asset.
concurrency:
  group: urban1-firmware-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: RustyPawz/fm1-HYP1
          ref: 57c456db61826331d356458c9c1a136517da7cbf
          path: hyp1
      - name: Install firmware build dependencies
        run: python3 -m pip install Pillow
      - name: Restore JieLi cross-toolchain and SDK
        id: tools
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: urban1-jieli-ac79-v1.2.1
      - name: Fetch device build tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          try() { for i in 1 2 3; do "$@" && return 0; echo "Retry $i"; sleep $((i * 15)); done; return 1; }
          [ -x ~/.jieli/toolchain/pi32v2/bin/clang ] || (cd hyp1 && try tools/get_toolchain.sh)
          fetch_sdk() {
            rm -rf ~/fw-AC79_AIoT_SDK
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK
          }
          [ -f ~/fw-AC79_AIoT_SDK/cpu/wl82/tools/uboot.boot ] || try fetch_sdk
      - name: Save device build tools
        if: steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: urban1-jieli-ac79-v1.2.1
      - name: Verify composer, genre lead, full FX and real HYP-1 host transport BEFORE publication
        run: |
          make -C urban-1 test
          python3 urban-1/tools/apply_hyp1.py --hyp-root hyp1
          (cd hyp1 && sh host/build_host.sh)
          mkdir -p hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_smoke.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_controls.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_song_mode.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_firmware_only.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_subgenre_live.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_scales.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_sfx.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_pianist.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_jazz_instruments.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_jazz_modulation.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_jazz_bass.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_ambient_chords.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_trance_clock.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_recorder.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_rec_instrument_catalog.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_rec_audition_octave.amb hyp1/build/urban
          cc -O2 -ffp-contract=off -std=c99 -Wall -Wextra -Wno-unused-function -Wno-unused-parameter \
            -DEN_HOST -DURBAN_SPLASH_TEST -D_POSIX_C_SOURCE=200809L \
            -Ihyp1/firmware/src -Ihyp1/firmware/src/dsp -Ihyp1/build/gen \
            -o hyp1/build/host/amb_splash_host hyp1/host/amb_host.c hyp1/firmware/src/dsp/amb.c -lm
          hyp1/build/host/amb_splash_host urban-1/tests/hyp1_kitsune_splash.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_tape_transport.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_style_fx_reset.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_fx_edit.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_filter_knobs.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_echo_wet.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_polychords.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_display_stable.amb hyp1/build/urban
      - name: Apply URBAN-1 and compile actual FM-1 package
        run: |
          cd hyp1
          ./build.sh --release 0.4.14
          test -s build/amb-0.4.14.fwsc
          cp build/amb-0.4.14.fwsc build/URBAN-1-v0.4.14-FX-EDIT-MASTER-TRACKS.fwsc
      - name: Verify package with HYP-1 updater tests
        run: |
          cd hyp1
          cc -o build/ota_test tests/ota_test.c
          build/ota_test build/amb-0.4.14.fwsc
          python3 tests/install_test.py
      - name: Publish untested experimental firmware as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: URBAN-1-v0.4.14-firmware-only
          path: hyp1/build/URBAN-1-v0.4.14-FX-EDIT-MASTER-TRACKS.fwsc
          if-no-files-found: error

      - name: Publish permanent firmware-only download (GitHub Releases)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          fw="hyp1/build/URBAN-1-v0.4.14-FX-EDIT-MASTER-TRACKS.fwsc"
          test -s "$fw"
          (cd hyp1/build && sha256sum URBAN-1-v0.4.14-FX-EDIT-MASTER-TRACKS.fwsc > SHA256SUMS-URBAN1-v0.4.14.txt)
          tag="urban1-firmware-v0.4.14"
          notes="URBAN-1 v0.4.14 FIRMWARE ONLY: NO-CROP Kitsune cover. Preserve every edge of the user-approved 1672x941 Neo-Tokyo pixel artwork by fitting the entire 16:9 image inside 240x240 screen at 240x136 with 52px dark letterbox above and below; no cropping, distortion, invented replacement art or extra overlay. 120x68 16-color flash-encoded palette bitmap with 2x nearest-neighbor and 60B row buffer. Keep the brief deterministic glitch-in and glitch-out on entrance and exit; no APK change. Previous v0.4.13: the approved nine-tailed orange fox and neon New Tokyo artwork is embedded as a compact 120x120 16-color RGB565 image scaled sharply to the FM-1 240x240 LCD, without APK modification or runtime PNG decoding. A short deterministic digital tearing / neon scanline transition introduces the cover; it remains on screen until any panel button/key is pressed, then a small exit glitch reveals the normal song/track UI. PLAY on the cover also starts the song after the transition. Input and rendering stay on the UI thread, not the audio ISR. Tests verify display stability, distinct glitch transition frames, PLAY/HOME skip behavior and compiled device updater package; firmware remains experimental. Previous v0.4.12: FIX: Native synth leads, modelled lead acoustic voices and procedural Sound FX now audition from the 27 FM-1 keys in REC while transport is STOPPED. Manual REC voice gains no longer follow silent intro/break arranger faders; recorded loops stay audible after hiding REC. Sound FX one-shot DSP is no longer discarded when stopped; explicit release still cancels on transport exit. Physical OCT+ and OCT- transpose the playable REC keyboard by -3..+3 octaves with an always-visible LCD octave indicator; key-off uses the latched note-on pitch and already-recorded absolute MIDI notes never shift. HYP native DSP host regression checks held synth lead level, modelled jazz PCM, stopped-transport SFX and recorded octave pitches. No APK rebuild, experimental. Previous v0.4.11: 78 available REC instrument programs in the emulator: 18 bass, 21 lead, 21 poly keys, 8 drum kits with six playable lanes, and 10 procedural SFX. REC ARM K1 cycles real programs by name; piano-roll replay, live performance and overdubs share a real DSP route, new queued HYP drum trigger and native procedural SFX. Generated part of recorded track is suppressed; other tracks continue. No external GM samples, project flash persistence or new APK; still experimental. Previous v0.4.10: Master Low Pass and High Pass are independent NUMERIC 0-100 cutoff controls, not ON/OFF flags. Real stereo HYP SVF cutoff now takes continuous 0-100 LP/HP values, with smooth bounded DSP slew, and momentary FX keyboard filter buttons temporarily override their numeric positions without losing them. The low/high filter values reset on a new genre/subgenre patch; native HYP integration regression exercises 0/40/55/100 and real DSP updates. Previous v0.4.9:  New Jazz-specific modulation wiring: piano, Rhodes and mallets respond to PAD envelope and LFO filter controls; jazz flute/vibes/bell respond to LEAD cutoff LFO and envelope, and upright/finger bass responds to Bass filter, LFO and envelope; includes live jazz PCM regression. MIDI editor note deletion now removes matching note-off, negative knob automation is preserved and REC shows current quantization grid. New REC 1/2/4/8-bar live MIDI keyboard recorder and piano roll with quantize OFF/1-4/1-8/1-16/1-32, continuous non-destructive overdub after 1st loop, and note plus 4-knob control automation in same loop. ENV and LFO are dedicated knob pages rather than mute/lock, with new lead filter-cutoff LFO rate/depth; mute/lock move to SEL+LFO/ENV. Play/Pause tape transport uses HYP original ring tape-stop and new low-to-full-speed tape start, toggled ON/OFF from FX MASTER Tape page. Long PLAY restarts song from INTRO. Changing genre/subgenre clears stale manual FX/EDIT patch overrides. Tested using native recorder unit tests, HYP keyboard/UI/tape DSP host tests and JieLi firmware packaging. Previous v0.4.8:  Repair silent Echo FX: knob P_ECHO now sends the song's actual audible master dry signal to HYP tape/Echoplex delay with 0-100 intensity, same source as momentary Throw but without requiring its switch; cap combined sends to avoid tape clipping. Keep BPM-synced Echo Time, natural feedback, stereo tape heads, reverb and dry levels unchanged. HYP host test verifies Echo=0 sends nothing, Echo=75 injects actual audio and produces delayed wet samples, and Throw still works independently. Previously v0.4.7:  Half-time jazz bass fix: Jazz Rap, Jazz Underground and Jazz Liquid now trigger precisely two upright/finger bass notes per standard 4/4 bar on beats 1 and 3 instead of four attacks, with slower melodic walking contour and slightly longer gate. This changes only the bass rhythm on the three jazz substyles; BPM, drums, lead, chords, other genres, and selected independent track styles remain unchanged. 192-seeded-take score regression across eight sections validates 8 attacks per four-bar regular phrase, release and HYP host DSP. Previously v0.4.6:  Jazz bass DSP rebuilt as actual note-driven upright pizzicato acoustic string synth, with attack, upper-partial damping, subtle body response and finger noise; new slightly firmer finger bass for Jazz Liquid. Jazz Rap and Jazz Underground use upright bass across takes. No old HYP DRONE electronic sustain/drive/LFO, bass pitch originates from authored 4-bar walking scores. Non-jazz bass still uses existing HYP synthesis. Independent bass-track style override, LCD names Upright Bass/Finger Bass, 512 native jazz tests plus real HYP bass note/frame and non-jazz restoration regression. Previously in 0.4.5: New true dedicated DSP instruments for jazz: four polyphonic piano/Rhodes/vibraphone chord voices and one separate melodic flute/vibraphone/soft-bell voice. Jazz Rap, Jazz Underground, Jazz Liquid and Sad Piano now choose musical instrument palettes per take, with non-crushed oscillator modelling, breath/hammer/mallet attacks, resonant tails, audio-sample-aligned pianist rolls and HYP mixing/reverb. Ambient and all other genres retain their native original sound engines. Host unit and end-to-end Jazz PCM renderer regression added. Previously in 0.4.4: Rebuilt bass/drums/harmony per subgenre: 56 independently authored four-bar bass rhythms with genre-specific walking/syncopated/drone/808/glide bass movement, all played on the same 16th clock; long open 7th/9th jazz and piano chords with sample-aligned ascending/descending note presses 14-24ms apart in real HYP DSP audio callback, never delayed by the Android UI; faster rhythmic EDM chords; ambient chords remain untouched block pads. Removed universal randomized kick, doubled clap and generic hat fills that erased subgenre identity; 56 four-bar drum pockets for separate kick/snare and hat tracks; Boom Bap keeps zero claps and clean Hip-hop kick. Real HYP host regression verifies piano roll versus ambient and 896 musical takes. Prior versions: Complete expanded 12-tone equal-tempered scale registry: 124 named entries spanning seven-note modes of major/melodic minor/harmonic minor/harmonic major/double harmonic/Hungarian/Romanian/Neapolitan/Persian/Enigmatic families plus pentatonic, six-note blues/whole-tone/augmented, octatonic diminished/bebop, Messiaen and chromatic; 56 subgenres each have three curated compatible scale options; 5-12 scale degrees are now genuinely used for bass, chords, lead and modal harmonization, not labels; manual EDIT scale persists through SAVE, style selection resets to curated palette. 12-TET approximations only, not microtonal scales. Tested via complete native score and real HYP DSP. Previously: Trance final: 4 original rhythm grammars and chord-aware 4-bar motifs, dedicated per-substyle synthesizer presets, zero off-grid sixteenth notes, no random arpeggiator pickups, softened filter/slide, audio-clock-synchronized lead triggers directly inside HYP DSP with double-buffered note scores. Both Song and Loop arrangements supported; no LCD-timing jitter. Full host and firmware regression tests. Previously: Rewritten 4-substyle Trance melodies: true eighth-note offbeat Progressive/Uplifting, repeating Psy bass-adjacent pulse, and tight Tech Trance quarter-note stabs. Removed random late sixteenth accents and excessive synth slide; Trance now queues notes on exact HYP audio drum tick via double-buffered DSP sequence instead of async UI polling. Preserves Sound FX track 7 and its 10 synthesized sounds from 0.4.0. Previously: New audible track 7 Sound FX, independent of drums, bass, lead, pad and atmospheric noise: 10 actual procedural DSP sound models (vinyl scratch, tape stop, reverse, sub impact, dub siren, glitch zap, riser, downlifter, vinyl pop and air whoosh), 56 per-subgenre palettes, sparse synchronized four-bar cues, track mute/solo/lock/regeneration and FX+EDIT knobs for sound/level/length/density. No imported samples; track 8 remains reserved. Previous sound corrections preserved. Previously: Fix a root-cause DSP issue: Break kit had hardwired 0.6 bitcrusher and 2.5x drive even at zero; normal hip-hop/underground now uses a clean Break kick with reduced click/drive and zero crusher. Only Lo-fi Hip-hop intentionally allows controlled saturation. Match Boom Bap, Jazz Rap, G-Funk and Underground kick envelope to Bristol Trip-hop; reserve isolated kick saturation and longer decay for Lo-fi Hip-hop; eliminate all Boom Bap clap lane events and mute its clap gain, including song sections and mixed-genre drum tracks. Also includes the previous hip-hop/underground overhaul and HYP DSP swing: dry break and G-Funk drum timbres, restrained Rhodes/organ/analog lead palette, warmer low-register bass, tighter chords and per-subgenre arrangements and FX, no randomly placed hip-hop drum hits, regression coverage for 128 multi-take variants.  FX button opens a real master mixing/FX editor, ALGORITHM navigates Master plus 8 track pages, PRESET/SELECT changes 4-knob parameter banks, and K1-K4 live-control actual HYP engine settings. EDIT opens a parallel master and 8-track synthesis editor: global tempo/key/scale/complexity/octaves/tuning/motion, bass resonant filter, envelope trigger/attack/decay/amount and full LFO rate/depth/shape/target, lead cutoff/resonance/envelope/slide/accent/wave, pad attack/hold/release/rest, detune, brightness and full LFO, drum lane independent level/tune/decay/kit, noise filter/color/pump. Master FX includes shared delay/time/reverb/room and drive plus actual HYP performance gates, repeat, filter, crusher, tape and fill. Manual edits survive automatic song-section presets; synth controls reflect real parameter values, with safe bounded layer levels. FX/EDIT are overlays and do not replace Song/Track mode; HOME and SEQ exit. Original mute and lock remain available on LFO and ENV in Tracks, GLO remains solo. HYP wet echo/reverb is shared, not independent track sends; Sound FX has an independent DSP voice and four edit knobs; Extra 2 remains reserved. Tested on real HYP-1 host engine, native score tests and actual JieLi hardware cross-compiler/package install tests; no APK rebuild; update via existing FM-1 Mobile Firmware > Actualizar todo. GPL-3.0-only experimental firmware; physical FM-1 audio not verified."
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$tag" "$fw" hyp1/build/SHA256SUMS-URBAN1-v0.4.14.txt --repo "$GH_REPO" --clobber
          else
            gh release create "$tag" "$fw" hyp1/build/SHA256SUMS-URBAN1-v0.4.14.txt \
              --repo "$GH_REPO" --target "$GITHUB_SHA" \
              --title "URBAN-1 v0.4.14 – Pixel-art Kitsune boot cover + glitch transitions" \
              --notes "$notes" --prerelease
          fi
          gh release view "$tag" --repo "$GH_REPO" --json assets,url \
            --jq '.url, (.assets[] | .name + " " + .url)'

      - name: Notify Android Update All catalog of new URBAN-1 firmware
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Workflow_dispatch may be invoked by GITHUB_TOKEN, unlike normal
          # release:published events; this is required for cross-workflow
          # updates of master/web/firmwares.json when GitHub Actions creates
          # the firmware release.
          gh workflow run sync-urban1-firmware.yml --repo "$GH_REPO" --ref master -f tag=urban1-firmware-v0.4.14
          echo "Triggered updater-catalog sync on master (APK untouched)."
