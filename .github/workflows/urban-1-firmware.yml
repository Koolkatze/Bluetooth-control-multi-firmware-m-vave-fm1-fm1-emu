name: URBAN-1 experimental FM-1 firmware
on:
  push:
    branches: [feature/urban-1]
    paths:
      - 'urban-1/**'
      - '.github/workflows/urban-1-firmware.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: RustyPawz/fm1-HYP1
          ref: 57c456db61826331d356458c9c1a136517da7cbf
          path: hyp1
      - name: Install firmware build dependencies
        run: python3 -m pip install Pillow
      - name: Restore JieLi cross-toolchain and SDK
        id: tools
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: urban1-jieli-ac79-v1.2.1
      - name: Fetch device build tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          try() { for i in 1 2 3; do "$@" && return 0; echo "Retry $i"; sleep $((i * 15)); done; return 1; }
          [ -x ~/.jieli/toolchain/pi32v2/bin/clang ] || (cd hyp1 && try tools/get_toolchain.sh)
          fetch_sdk() {
            rm -rf ~/fw-AC79_AIoT_SDK
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK
          }
          [ -f ~/fw-AC79_AIoT_SDK/cpu/wl82/tools/uboot.boot ] || try fetch_sdk
      - name: Save device build tools
        if: steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: urban1-jieli-ac79-v1.2.1
      - name: Apply URBAN-1 and compile actual FM-1 package
        run: |
          python3 urban-1/tools/apply_hyp1.py --hyp-root hyp1
          cd hyp1
          ./build.sh --release 0.3.0
          test -s build/amb-0.3.0.fwsc
          cp build/amb-0.3.0.fwsc build/URBAN-1-v0.3.0-COMPOSER.fwsc
      - name: Verify package with HYP-1 updater tests
        run: |
          cd hyp1
          cc -o build/ota_test tests/ota_test.c
          build/ota_test build/amb-0.3.0.fwsc
          python3 tests/install_test.py
      - name: Publish untested experimental firmware as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: URBAN-1-v0.3.0-firmware-only
          path: hyp1/build/URBAN-1-v0.3.0-COMPOSER.fwsc
          if-no-files-found: error

      - name: Publish permanent firmware-only download (GitHub Releases)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          fw="hyp1/build/URBAN-1-v0.3.0-COMPOSER.fwsc"
          test -s "$fw"
          (cd hyp1/build && sha256sum URBAN-1-v0.3.0-COMPOSER.fwsc > SHA256SUMS-URBAN1-v0.3.0.txt)
          tag="urban1-firmware-v0.3.0"
          notes="FIRMWARE ONLY: Update All in FM-1 Mobile downloads this firmware from the master catalog; no APK is rebuilt or installed. v0.3.0 Composer: 10 scales/modes, 56 diatonic genre progression templates and six chord colours; genuine polyphonic 2-4-note PAD chords with inversion/voice-leading; contour-based lead motifs, varied onsets, fresh per-take syncopated bass and drum scores. 448 generated test takes (32 each of 14 genres) had distinct musical fingerprints, not just distinct seeds. Song Mode 56 bars, four-bar A-H phrases (64 steps), looping mode changes sections at the next bar boundary. Song genre/subgenre and 56 patches across all available 16 DRONE bass, 16 ACID lead, 16 PAD timbres and 8 built-in HYP drum kits. Important: this does NOT yet port TRIBE, X0X or ChoralRoot synthesis engines. Eight logical tracks, HYP's existing three melodic engine types and four PAD polyphony; 16th-note timing cannot generate genuine 32nd/64th trap hat rolls. Host/C/compiler/OTA tested, not yet tested on physical FM-1 or your Android phone. GPL-3.0-only firmware derived from HYP-1."
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$tag" "$fw" hyp1/build/SHA256SUMS-URBAN1-v0.3.0.txt --repo "$GH_REPO" --clobber
          else
            gh release create "$tag" "$fw" hyp1/build/SHA256SUMS-URBAN1-v0.3.0.txt \
              --repo "$GH_REPO" --target "$GITHUB_SHA" \
              --title "URBAN-1 firmware v0.3.0 – COMPOSER (10 modes, real poly chords, new songs)" \
              --notes "$notes" --prerelease
          fi
          gh release view "$tag" --repo "$GH_REPO" --json assets,url \
            --jq '.url, (.assets[] | .name + " " + .url)'

      - name: Notify Android Update All catalog of new URBAN-1 firmware
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Workflow_dispatch may be invoked by GITHUB_TOKEN, unlike normal
          # release:published events; this is required for cross-workflow
          # updates of master/web/firmwares.json when GitHub Actions creates
          # the firmware release.
          gh workflow run sync-urban1-firmware.yml --repo "$GH_REPO" --ref master -f tag=urban1-firmware-v0.3.0
          echo "Triggered updater-catalog sync on master (APK untouched)."
