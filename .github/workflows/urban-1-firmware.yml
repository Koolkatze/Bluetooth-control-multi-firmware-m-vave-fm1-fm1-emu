name: URBAN-1 experimental FM-1 firmware
on:
  push:
    branches: [feature/urban-1]
    paths:
      - 'urban-1/**'
      - '.github/workflows/urban-1-firmware.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: RustyPawz/fm1-HYP1
          ref: 57c456db61826331d356458c9c1a136517da7cbf
          path: hyp1
      - name: Install firmware build dependencies
        run: python3 -m pip install Pillow
      - name: Restore JieLi cross-toolchain and SDK
        id: tools
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: urban1-jieli-ac79-v1.2.1
      - name: Fetch device build tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          try() { for i in 1 2 3; do "$@" && return 0; echo "Retry $i"; sleep $((i * 15)); done; return 1; }
          [ -x ~/.jieli/toolchain/pi32v2/bin/clang ] || (cd hyp1 && try tools/get_toolchain.sh)
          fetch_sdk() {
            rm -rf ~/fw-AC79_AIoT_SDK
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK
          }
          [ -f ~/fw-AC79_AIoT_SDK/cpu/wl82/tools/uboot.boot ] || try fetch_sdk
      - name: Save device build tools
        if: steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: urban1-jieli-ac79-v1.2.1
      - name: Apply URBAN-1 and compile actual FM-1 package
        run: |
          python3 urban-1/tools/apply_hyp1.py --hyp-root hyp1
          cd hyp1
          ./build.sh --release 0.2.0
          test -s build/amb-0.2.0.fwsc
          cp build/amb-0.2.0.fwsc build/URBAN-1-v0.2.0-SONG4-LOOP.fwsc
      - name: Verify package with HYP-1 updater tests
        run: |
          cd hyp1
          cc -o build/ota_test tests/ota_test.c
          build/ota_test build/amb-0.2.0.fwsc
          python3 tests/install_test.py
      - name: Publish untested experimental firmware as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: URBAN-1-v0.2.0-firmware-only
          path: hyp1/build/URBAN-1-v0.2.0-SONG4-LOOP.fwsc
          if-no-files-found: error

      - name: Publish permanent firmware-only download (GitHub Releases)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          fw="hyp1/build/URBAN-1-v0.2.0-SONG4-LOOP.fwsc"
          test -s "$fw"
          (cd hyp1/build && sha256sum URBAN-1-v0.2.0-SONG4-LOOP.fwsc > SHA256SUMS-URBAN1-v0.2.0.txt)
          tag="urban1-firmware-v0.2.0"
          notes="Firmware-only release for M-VAVE FM-1 and the existing Android FM-1 emulator. No APK update needed. Song Mode: 56 bars and four-bar A-H phrases (64 sixteenths per phrase); LOOP: repeat current four-bar phrase indefinitely and change A-H at the next one-bar boundary; KNOB3 picks the song subgenre (SELECT picks key); 56 genre-specific synth/drum/FX patches, 14 grooves, harmony and section-aware orchestration. Experimental GPL-3.0 HYP-1-based firmware: 8 logical tracks but only HYP-1's existing drum, bass, lead and pad audio engines; 16-step drum timing cannot represent hi-hat subdivisions faster than 16ths. Validated by host integration, native C tests, cross-compile and updater package checks; not physically tested. Import the .fwsc into the emulator firmware picker."
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$tag" "$fw" hyp1/build/SHA256SUMS-URBAN1-v0.2.0.txt --repo "$GH_REPO" --clobber
          else
            gh release create "$tag" "$fw" hyp1/build/SHA256SUMS-URBAN1-v0.2.0.txt \
              --repo "$GH_REPO" --target "$GITHUB_SHA" \
              --title "URBAN-1 firmware v0.2.0 – Song 4-bar + Loop + genre patches" \
              --notes "$notes" --prerelease
          fi
          gh release view "$tag" --repo "$GH_REPO" --json assets,url \
            --jq '.url, (.assets[] | .name + " " + .url)'
