name: URBAN-1 experimental FM-1 firmware
on:
  push:
    branches: [feature/urban-1]
    paths:
      - 'urban-1/**'
      - '.github/workflows/urban-1-firmware.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
# One release upload at a time; old runs must never replace a newer
# firmware while Update All reads the canonical GitHub asset.
concurrency:
  group: urban1-firmware-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: RustyPawz/fm1-HYP1
          ref: 57c456db61826331d356458c9c1a136517da7cbf
          path: hyp1
      - name: Install firmware build dependencies
        run: python3 -m pip install Pillow
      - name: Restore JieLi cross-toolchain and SDK
        id: tools
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: urban1-jieli-ac79-v1.2.1
      - name: Fetch device build tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          try() { for i in 1 2 3; do "$@" && return 0; echo "Retry $i"; sleep $((i * 15)); done; return 1; }
          [ -x ~/.jieli/toolchain/pi32v2/bin/clang ] || (cd hyp1 && try tools/get_toolchain.sh)
          fetch_sdk() {
            rm -rf ~/fw-AC79_AIoT_SDK
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK
          }
          [ -f ~/fw-AC79_AIoT_SDK/cpu/wl82/tools/uboot.boot ] || try fetch_sdk
      - name: Save device build tools
        if: steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: urban1-jieli-ac79-v1.2.1
      - name: Verify composer, genre lead, full FX and real HYP-1 host transport BEFORE publication
        run: |
          make -C urban-1 test
          python3 urban-1/tools/apply_hyp1.py --hyp-root hyp1
          (cd hyp1 && sh host/build_host.sh)
          mkdir -p hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_smoke.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_controls.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_song_mode.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_firmware_only.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_subgenre_live.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_sfx.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_trance_clock.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_fx_edit.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_polychords.amb hyp1/build/urban
          hyp1/build/host/amb_host urban-1/tests/hyp1_display_stable.amb hyp1/build/urban
      - name: Apply URBAN-1 and compile actual FM-1 package
        run: |
          cd hyp1
          ./build.sh --release 0.4.2
          test -s build/amb-0.4.2.fwsc
          cp build/amb-0.4.2.fwsc build/URBAN-1-v0.4.2-FX-EDIT-MASTER-TRACKS.fwsc
      - name: Verify package with HYP-1 updater tests
        run: |
          cd hyp1
          cc -o build/ota_test tests/ota_test.c
          build/ota_test build/amb-0.4.2.fwsc
          python3 tests/install_test.py
      - name: Publish untested experimental firmware as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: URBAN-1-v0.4.2-firmware-only
          path: hyp1/build/URBAN-1-v0.4.2-FX-EDIT-MASTER-TRACKS.fwsc
          if-no-files-found: error

      - name: Publish permanent firmware-only download (GitHub Releases)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          fw="hyp1/build/URBAN-1-v0.4.2-FX-EDIT-MASTER-TRACKS.fwsc"
          test -s "$fw"
          (cd hyp1/build && sha256sum URBAN-1-v0.4.2-FX-EDIT-MASTER-TRACKS.fwsc > SHA256SUMS-URBAN1-v0.4.2.txt)
          tag="urban1-firmware-v0.4.2"
          notes="URBAN-1 v0.4.2 FIRMWARE ONLY: Trance final: 4 original rhythm grammars and chord-aware 4-bar motifs, dedicated per-substyle synthesizer presets, zero off-grid sixteenth notes, no random arpeggiator pickups, softened filter/slide, audio-clock-synchronized lead triggers directly inside HYP DSP with double-buffered note scores. Both Song and Loop arrangements supported; no LCD-timing jitter. Full host and firmware regression tests. Previously: Rewritten 4-substyle Trance melodies: true eighth-note offbeat Progressive/Uplifting, repeating Psy bass-adjacent pulse, and tight Tech Trance quarter-note stabs. Removed random late sixteenth accents and excessive synth slide; Trance now queues notes on exact HYP audio drum tick via double-buffered DSP sequence instead of async UI polling. Preserves Sound FX track 7 and its 10 synthesized sounds from 0.4.0. Previously: New audible track 7 Sound FX, independent of drums, bass, lead, pad and atmospheric noise: 10 actual procedural DSP sound models (vinyl scratch, tape stop, reverse, sub impact, dub siren, glitch zap, riser, downlifter, vinyl pop and air whoosh), 56 per-subgenre palettes, sparse synchronized four-bar cues, track mute/solo/lock/regeneration and FX+EDIT knobs for sound/level/length/density. No imported samples; track 8 remains reserved. Previous sound corrections preserved. Previously: Fix a root-cause DSP issue: Break kit had hardwired 0.6 bitcrusher and 2.5x drive even at zero; normal hip-hop/underground now uses a clean Break kick with reduced click/drive and zero crusher. Only Lo-fi Hip-hop intentionally allows controlled saturation. Match Boom Bap, Jazz Rap, G-Funk and Underground kick envelope to Bristol Trip-hop; reserve isolated kick saturation and longer decay for Lo-fi Hip-hop; eliminate all Boom Bap clap lane events and mute its clap gain, including song sections and mixed-genre drum tracks. Also includes the previous hip-hop/underground overhaul and HYP DSP swing: dry break and G-Funk drum timbres, restrained Rhodes/organ/analog lead palette, warmer low-register bass, tighter chords and per-subgenre arrangements and FX, no randomly placed hip-hop drum hits, regression coverage for 128 multi-take variants.  FX button opens a real master mixing/FX editor, ALGORITHM navigates Master plus 8 track pages, PRESET/SELECT changes 4-knob parameter banks, and K1-K4 live-control actual HYP engine settings. EDIT opens a parallel master and 8-track synthesis editor: global tempo/key/scale/complexity/octaves/tuning/motion, bass resonant filter, envelope trigger/attack/decay/amount and full LFO rate/depth/shape/target, lead cutoff/resonance/envelope/slide/accent/wave, pad attack/hold/release/rest, detune, brightness and full LFO, drum lane independent level/tune/decay/kit, noise filter/color/pump. Master FX includes shared delay/time/reverb/room and drive plus actual HYP performance gates, repeat, filter, crusher, tape and fill. Manual edits survive automatic song-section presets; synth controls reflect real parameter values, with safe bounded layer levels. FX/EDIT are overlays and do not replace Song/Track mode; HOME and SEQ exit. Original mute and lock remain available on LFO and ENV in Tracks, GLO remains solo. HYP wet echo/reverb is shared, not independent track sends; Sound FX has an independent DSP voice and four edit knobs; Extra 2 remains reserved. Tested on real HYP-1 host engine, native score tests and actual JieLi hardware cross-compiler/package install tests; no APK rebuild; update via existing FM-1 Mobile Firmware > Actualizar todo. GPL-3.0-only experimental firmware; physical FM-1 audio not verified."
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$tag" "$fw" hyp1/build/SHA256SUMS-URBAN1-v0.4.2.txt --repo "$GH_REPO" --clobber
          else
            gh release create "$tag" "$fw" hyp1/build/SHA256SUMS-URBAN1-v0.4.2.txt \
              --repo "$GH_REPO" --target "$GITHUB_SHA" \
              --title "URBAN-1 v0.4.2 – Trance Melodies and Audio-Clock Synchronization" \
              --notes "$notes" --prerelease
          fi
          gh release view "$tag" --repo "$GH_REPO" --json assets,url \
            --jq '.url, (.assets[] | .name + " " + .url)'

      - name: Notify Android Update All catalog of new URBAN-1 firmware
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Workflow_dispatch may be invoked by GITHUB_TOKEN, unlike normal
          # release:published events; this is required for cross-workflow
          # updates of master/web/firmwares.json when GitHub Actions creates
          # the firmware release.
          gh workflow run sync-urban1-firmware.yml --repo "$GH_REPO" --ref master -f tag=urban1-firmware-v0.4.2
          echo "Triggered updater-catalog sync on master (APK untouched)."
